<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Experience</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --gold: #d4af37;
      --burgundy: #58111a;
      --white: #fcfcfc;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: 'Playfair Display', Georgia, serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      perspective: 1000px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 4rem;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  inset 0 0 20px rgba(212, 175, 55, 0.05);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      box-shadow: 0 40px 80px rgba(88, 17, 26, 0.4),
                  inset 0 0 30px rgba(212, 175, 55, 0.15);
    }

    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.5rem;
      display: block;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.95rem;
      color: #a0a0a5;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      font-weight: 300;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      border-radius: 50px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      background: var(--burgundy);
      border-color: var(--burgundy);
      box-shadow: 0 0 25px rgba(88, 17, 26, 0.8);
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="container">
    <div class="card" id="card">
      <span class="tag">Interactive Visual</span>
      <h1>Elegance in Motion</h1>
      <p>Move your cursor across the screen to interact with the fluid golden aura and tilt the glass perspective.</p>
      <button class="btn" onclick="burstParticles()">Trigger Aura</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let mouse = { x: null, y: null, radius: 180 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.5;
        this.baseX = this.x;
        this.baseY = this.y;
        this.density = (Math.random() * 30) + 1;
        this.color = Math.random() > 0.4 ? '#d4af37' : '#58111a';
        this.alpha = Math.random() * 0.7 + 0.3;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }

      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let forceDirectionX = dx / distance;
        let forceDirectionY = dy / distance;
        let maxDistance = mouse.radius;
        let force = (maxDistance - distance) / maxDistance;
        let directionX = forceDirectionX * force * this.density;
        let directionY = forceDirectionY * force * this.density;

        if (distance < mouse.radius) {
          this.x -= directionX;
          this.y -= directionY;
        } else {
          if (this.x !== this.baseX) {
            let dx = this.x - this.baseX;
            this.x -= dx / 10;
          }
          if (this.y !== this.baseY) {
            let dy = this.y - this.baseY;
            this.y -= dy / 10;
          }
        }
      }
    }

    function init() {
      particles = [];
      let numberOfParticles = (width * height) / 9000;
      for (let i = 0; i < numberOfParticles; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].draw();
        particles[i].update();
      }
      requestAnimationFrame(animate);
    }

    init();
    animate();

    const card = document.getElementById('card');
    document.addEventListener('mousemove', (e) => {
      let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    function burstParticles() {
      for (let i = 0; i < 30; i++) {
        let p = new Particle();
        p.x = window.innerWidth / 2;
        p.y = window.innerHeight / 2;
        p.density = Math.random() * 80 + 20;
        particles.push(p);
      }
    }
  </script>
</body>
</html>
